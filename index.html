<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorteio F3 AudioStudio</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px}.hero{text-align:center;padding:18px 0}.hero h1{font-size:clamp(28px,5vw,48px);margin:0}.sub{color:#bbb;margin:10px 0 18px}.info,.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pill{background:#171720;border:1px solid #292936;padding:10px 14px;border-radius:999px}.controls{display:flex;gap:10px;margin:20px 0}.controls input{flex:1;padding:14px;border-radius:10px;border:1px solid #333;background:#15151d;color:#fff}.btn{border:0;border-radius:12px;padding:12px 18px;background:#25d366;color:#071b0d;font-weight:800;cursor:pointer}.legend{justify-content:flex-start;color:#ccc;margin:15px 0}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:5px}.g{background:#19c37d}.p{background:#8b5cf6}.y{background:#eab308}.r{background:#ef4444}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.num{border:0;border-radius:8px;padding:10px 2px;background:#123d2d;color:#fff;cursor:pointer;font-weight:700}.num.sel{background:#8b5cf6}.num.res{background:#a87d00;cursor:not-allowed}.num.paid{background:#8d2222;cursor:not-allowed}.panel{position:sticky;bottom:0;margin-top:22px;background:#111118;border:1px solid #30303b;border-radius:16px;padding:16px;box-shadow:0 -8px 30px #0008}.summary{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;align-items:center}.total{font-size:24px;font-weight:800}.small{font-size:13px;color:#aaa;margin-top:8px}.status{margin-top:10px;color:#ddd;min-height:20px}@media(max-width:800px){.grid{grid-template-columns:repeat(5,1fr)}.num{padding:12px 1px;font-size:13px}.controls{flex-wrap:wrap}}</style></head><body><div class="wrap"><section class="hero"><h1>🎟️ SORTEIO F3 AUDIOSTUDIO</h1><div class="sub">Escolha seus números e participe pelo WhatsApp.</div><div class="info"><div class="pill">2.000 números</div><div class="pill">R$ 1,00 por número</div><div class="pill">Reserva compartilhada</div></div></section><div class="controls"><input id="search" type="number" min="1" max="2000" placeholder="Digite um número..."><button class="btn" id="refresh">↻ Atualizar</button></div><div class="legend"><span><i class="dot g"></i>Disponível</span><span><i class="dot p"></i>Selecionado</span><span><i class="dot y"></i>Reservado</span><span><i class="dot r"></i>Pago</span></div><div id="grid" class="grid"></div><div class="panel"><div class="summary"><div><strong id="count">0</strong> número(s)</div><div class="total">Total: R$ <span id="total">0,00</span></div><button id="go" class="btn" disabled>📲 QUERO PARTICIPAR</button></div><div id="status" class="status"></div><div class="small">A reserva é registrada no Google Sheets antes do envio ao WhatsApp.</div></div></div><script>const API_URL="https://script.google.com/macros/s/AKfycby3b5rJZOdVs5XdKuG5Yc_JMPoChGVHM6hqVlTozjETpkk-_84j0upa0z0cBSgKGqrt/exec";const WA="5598991675993",TOTAL=2000;let state=new Map(),selected=new Set();const $=id=>document.getElementById(id);function lab(n){return String(n).padStart(4,'0')}function money(n){return n.toLocaleString('pt-BR',{minimumFractionDigits:2})}function render(){grid.innerHTML='';for(let n=1;n<=TOTAL;n++){let b=document.createElement('button');b.className='num';b.textContent=lab(n);let s=state.get(n)||'available';if(selected.has(n))b.classList.add('sel');else if(s==='reserved'){b.classList.add('res');b.disabled=true}else if(s==='paid'){b.classList.add('paid');b.disabled=true}else b.classList.add('g');b.onclick=()=>{if((state.get(n)||'available')==='available'){selected.has(n)?selected.delete(n):selected.add(n);render()}};grid.appendChild(b)}$('count').textContent=selected.size;$('total').textContent=money(selected.size);$('go').disabled=!selected.size}async function load(){if(API_URL.includes('COLE_AQUI')){for(let n=1;n<=TOTAL;n++)state.set(n,'available');render();$('status').textContent='⚠️ Falta configurar a URL do Apps Script.';return}try{$('status').textContent='Atualizando...';let r=await fetch(API_URL+'?action=list',{cache:'no-store'}),d=await r.json();state=new Map((d.numbers||[]).map(x=>[Number(x.number),x.status]));selected=new Set([...selected].filter(n=>(state.get(n)||'available')==='available'));render();$('status').textContent='Números atualizados.'}catch(e){$('status').textContent='Não foi possível atualizar agora.'}}$('go').onclick=async()=>{let nums=[...selected].sort((a,b)=>a-b),name=prompt('Digite seu nome:');if(!name)return;let phone=prompt('Digite seu WhatsApp com DDD:');if(!phone)return;try{let r=await const url =
  API_URL +
  '?action=reserve' +
  '&numbers=' + encodeURIComponent(nums.join(',')) +
  '&name=' + encodeURIComponent(name) +
  '&whatsapp=' + encodeURIComponent(phone);

const r = await fetch(url);
const d = await r.json();

if (!d.ok) {
  alert(
    'Número(s) indisponível(is): ' +
    (d.unavailable || []).map(lab).join(', ')
  );
  load();
  return;
}

let msg =
`🎟️ QUERO PARTICIPAR DO SORTEIO F3!

👤 Nome: ${name}
📱 WhatsApp: ${phone}
🔢 Números: ${nums.map(lab).join(', ')}
📦 Quantidade: ${nums.length}
💰 Total: R$ ${money(nums.length)}

✅ Números reservados no sistema. Aguardo as instruções para pagamento e confirmação.`;

location.href =
  'https://wa.me/' +
  WA +
  '?text=' +
  encodeURIComponent(msg);

selected.clear();
load();}catch(e){alert('Erro ao reservar. Tente novamente.');load()}};$('refresh').onclick=load;$('search').onchange=()=>{let n=Number($('search').value);if(n>=1&&n<=TOTAL)document.querySelectorAll('.num')[n-1].scrollIntoView({behavior:'smooth',block:'center'})};load();setInterval(load,15000);</script></body></html>
