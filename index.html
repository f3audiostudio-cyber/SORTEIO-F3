<!doctype html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sorteio F3 AudioStudio</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#0b0b10;
  color:#fff;
  font-family:Arial,sans-serif
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:22px
}

.hero{
  text-align:center;
  padding:18px 0
}

.hero h1{
  font-size:clamp(28px,5vw,48px);
  margin:0
}

.sub{
  color:#bbb;
  margin:10px 0 18px
}

.info,
.legend{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap
}

.pill{
  background:#171720;
  border:1px solid #292936;
  padding:10px 14px;
  border-radius:999px
}

.controls{
  display:flex;
  gap:10px;
  margin:20px 0
}

.controls input{
  flex:1;
  padding:14px;
  border-radius:10px;
  border:1px solid #333;
  background:#15151d;
  color:#fff
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  background:#25d366;
  color:#071b0d;
  font-weight:800;
  cursor:pointer
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed
}

.legend{
  justify-content:flex-start;
  color:#ccc;
  margin:15px 0
}

.dot{
  display:inline-block;
  width:13px;
  height:13px;
  border-radius:50%;
  margin-right:5px
}

  background:#19c37d
}

  background:#8b5cf6
}

  background:#eab308
}

  background:#ef4444
}

  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:7px
}

  padding:10px 2px;

}

  background:#8b5cf6
}

  .grid{
    grid-template-columns:repeat(5,1fr)

</head>


<body>

<div class="wrap">

<section class="hero">

<h1>🎟️ SORTEIO F3 AUDIOSTUDIO</h1>

<div class="sub">
Escolha seus números e participe pelo WhatsApp.
</div>

<div class="info">

<div class="pill">
2.000 números
</div>

<div class="pill">
R$ 1,00 por número
</div>

<div class="pill">
Reserva compartilhada
</div>

</div>

</section>


<div class="controls">

<input
id="search"
type="number"
min="1"
max="2000"
placeholder="Digite um número..."
>

<button
class="btn"
id="refresh"
>
↻ Atualizar
</button>

</div>


<div class="legend">

<span>
<i class="dot g"></i>
Disponível
</span>

<span>
<i class="dot p"></i>
Selecionado
</span>

<span>
<i class="dot y"></i>
Reservado
</span>

<span>
<i class="dot r"></i>
Pago
</span>

</div>


<div
id="grid"
class="grid"
></div>


<div class="panel">

<div class="summary">

<div>
<strong id="count">0</strong>
número(s)
</div>

<div class="total">
Total: R$
<span id="total">0,00</span>
</div>

<button
id="go"
class="btn"
disabled
>
📲 QUERO PARTICIPAR
</button>

</div>


<div
id="status"
class="status"
></div>


<div class="small">
A reserva é registrada no Google Sheets antes do envio ao WhatsApp.
</div>

</div>

</div>


<script>

/* =========================================
   CONFIGURAÇÕES
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycby3b5rJZOdVs5XdKuG5Y_cJMPoChGVHM6hqVlTozjETpkk-_84j0upa0z0cBSgKGqrt/exec";

const WA = "5598991675993";

const TOTAL = 2000;


/* =========================================
   ESTADO
========================================= */

let state = new Map();

let selected = new Set();


const $ = id =>
document.getElementById(id);


/* =========================================
   FUNÇÕES
========================================= */

function lab(n){

  return String(n).padStart(4,"0");

}


function money(n){

  return n.toLocaleString(
    "pt-BR",
    {
      minimumFractionDigits:2
    }
  );

}


/* =========================================
   DESENHA OS NÚMEROS
========================================= */

function render(){

  const grid =
    $("grid");

  grid.innerHTML = "";


  for(
    let n = 1;
    n <= TOTAL;
    n++
  ){

    const b =
      document.createElement("button");


    b.className =
      "num";


    b.textContent =
      lab(n);


    const s =
      state.get(n) ||
      "available";


    /* selecionado */

    if(
      selected.has(n)
    ){

      b.classList.add("sel");

    }


    /* reservado */

    else if(
      s === "reserved"
    ){

      b.classList.add("res");

      b.disabled = true;

    }


    /* pago */

    else if(
      s === "paid"
    ){

      b.classList.add("paid");

      b.disabled = true;

    }


    /* disponível */

    else{

      b.classList.add("g");

    }


    b.onclick = () => {

      const status =
        state.get(n) ||
        "available";


      if(
        status !== "available"
      ){

        return;

      }


      if(
        selected.has(n)
      ){

        selected.delete(n);

      }
      else{

        selected.add(n);

      }


      render();

    };


    grid.appendChild(b);

  }


  $("count").textContent =
    selected.size;


  $("total").textContent =
    money(selected.size);


  $("go").disabled =
    selected.size === 0;

}


/* =========================================
   CARREGA OS NÚMEROS DO APPS SCRIPT
========================================= */

async function load(){

  try{

    $("status").textContent =
      "Atualizando números...";


    const url =
      API_URL +
      "?action=list" +
      "&t=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    console.log(
      "Resposta LIST:",
      data
    );


    state =
      new Map(
        (data.numbers || [])
        .map(item => [
          Number(item.number),
          item.status
        ])
      );


    selected =
      new Set(
        [...selected].filter(
          number =>
            (state.get(number) || "available")
            === "available"
        )
      );


    render();


    $("status").textContent =
      "Números atualizados.";

  }

  catch(error){

    console.error(
      "Erro ao carregar números:",
      error
    );


    $("status").textContent =
      "Não foi possível atualizar agora.";

    render();

  }

}


/* =========================================
   RESERVA
========================================= */

$("go").onclick =
async function(){

  const nums =
    [...selected]
    .sort(
      (a,b) => a-b
    );


  if(
    nums.length === 0
  ){

    return;

  }


  const name =
    prompt(
      "Digite seu nome:"
    );


  if(
    !name
  ){

    return;

  }


  const phone =
    prompt(
      "Digite seu WhatsApp com DDD:"
    );


  if(
    !phone
  ){

    return;

  }


  try{

    $("go").disabled =
      true;


    $("status").textContent =
      "Reservando seus números...";


    /* =====================================
       MONTA A URL DA RESERVA

       IMPORTANTE:
       NÃO COLOCAR "await" ANTES DE const.
    ===================================== */

   const response =
  await fetch(
    API_URL,
    {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "reserve",
        numbers: nums,
        name: name,
        whatsapp: phone
      })
    }
  );

    /* =====================================
       ENVIA PARA O APPS SCRIPT
    ===================================== */

    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    console.log(
      "Resposta RESERVE:",
      data
    );


    /* =====================================
       NÚMERO JÁ RESERVADO
    ===================================== */

    if(
      !data.ok
    ){

      alert(
        "Número(s) indisponível(is): " +
        (
          data.unavailable || []
        )
        .map(lab)
        .join(", ")
      );


      await load();


      $("go").disabled =
        selected.size === 0;


      return;

    }


    /* =====================================
       MENSAGEM DO WHATSAPP
    ===================================== */

    const msg =
`🎟️ QUERO PARTICIPAR DO SORTEIO F3!

👤 Nome: ${name}
📱 WhatsApp: ${phone}
🔢 Números: ${nums.map(lab).join(", ")}
📦 Quantidade: ${nums.length}
💰 Total: R$ ${money(nums.length)}

✅ Números reservados no sistema. Aguardo as instruções para pagamento e confirmação.`;


    /* =====================================
       LIMPA SELEÇÃO
    ===================================== */

    selected.clear();


    /* =====================================
       ATUALIZA A TELA
    ===================================== */

    await load();


    /* =====================================
       ABRE WHATSAPP
    ===================================== */

    window.location.href =
      "https://wa.me/" +
      WA +
      "?text=" +
      encodeURIComponent(msg);

  }

  catch(error){

    console.error(
      "ERRO NA RESERVA:",
      error
    );


    alert(
      "Erro ao reservar. Tente novamente."
    );


    await load();


    $("go").disabled =
      selected.size === 0;

  }

};


/* =========================================
   BOTÃO ATUALIZAR
========================================= */

$("refresh").onclick =
load;


/* =========================================
   BUSCA DE NÚMERO
========================================= */

$("search").onchange =
function(){

  const n =
    Number(
      $("search").value
    );


  if(
    n >= 1 &&
    n <= TOTAL
  ){

    const buttons =
      document.querySelectorAll(
        ".num"
      );


    if(
      buttons[n - 1]
    ){

      buttons[n - 1]
      .scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    }

  }

};


/* =========================================
   INICIA
========================================= */

load();


/* Atualiza automaticamente
   a cada 15 segundos */

setInterval(
  load,
  15000
);

</script>

</body>
</html>
